name: Bug report
description: Report a problem with the Terragram engine, CLI, GitHub Action or schemas.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please do **not** include secrets, tokens, or private
        Terraform in anything you paste below.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Engine (terragram-engine)
        - CLI (terragram)
        - GitHub Action
        - JSON Schemas
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The command, workflow step or model file that triggers the issue, as small as you can make it.
      placeholder: |
        1. Run …
        2. With this model file …
        3. See …
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, OS, and Terraform or OpenTofu version if it matters. e.g. Node 24.2 on Ubuntu 24.04.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: The command output or workflow log (redact secrets). Formatted as code.
      render: shell
    validations:
      required: false
