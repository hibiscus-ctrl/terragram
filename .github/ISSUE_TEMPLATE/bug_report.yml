name: Bug report
description: Report a problem with Terragram Cloud (the dashboard, marketing site, or API).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please do **not** include secrets, tokens, or private
        Terraform in anything you paste below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps that trigger the issue.
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page / URL
      description: Where it happened (e.g. /console/acme/infra), with no tokens in the URL.
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      description: e.g. Chrome 140 on Windows 11.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Console / network errors
      description: Any browser console or network error (redact secrets). Formatted as code.
      render: shell
    validations:
      required: false
