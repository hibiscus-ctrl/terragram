name: Sandbox (Google Cloud)

# Applies the four Google Cloud plans of the emit gate (scripts/emit-plans.ts) to a real sandbox
# project, checks what it built is there and healthy, and destroys it again, whatever happened. It
# runs only when started by hand, and its job waits for the approval of the sandbox environment's
# reviewers before it signs in: the environment's variables name the project, the workload identity
# provider and the service account, and the provider accepts the token of that environment's job,
# from this workflow file on main, started by hand, and no other. No key is created or stored.
#
# Two jobs, so no package of this repository's dependency tree runs where a token can be had. "plans"
# installs the dependencies (without their install scripts) and generates the plans, and has no
# id-token permission and no environment. "round-trip" has both: it installs nothing, and runs only
# pinned actions, this repository's scripts, the gcloud CLI and Terraform with the plans "plans" wrote.
# Those plans came out of the dependency tree, so before it signs in the job refuses any plan that is not
# what the generator writes (scripts/sandbox-gcp-validate.mjs, on Node's built-ins: no provisioner, no
# external data source, no module, no backend, no provider but the three it lists, no file but plain
# Terraform and the generator's placeholders), and Terraform then installs only the providers of the
# committed lock files (scripts/sandbox-gcp-locks/, init with -lockfile=readonly, no plugin
# cache, the CLI configuration scripts/sandbox-gcp.tfrc). Both jobs' summaries give the plans' digest.
# Before it applies anything it checks that no service account of the project holds Editor or Owner
# (a plan may attach any service account of the project to what it creates), and stops if one does.
#
# The plans are the generator's own, with the changes a shared project needs (scripts/lib/sandbox-gcp.ts
# lists them, and the run's summary says which): no App Engine application (one per project, for good),
# no project to create, no deletion protection. Every resource is named ih-sbx-tg-... and labelled
# terragram_sandbox=<run id>. The run sweeps by that name first (what an earlier run that was
# cancelled, timed out or lost its runner left) and last, and a run with the plan "sweep" does only that.
#
# A cancelled job gets five minutes for its always() steps before GitHub stops it, too few for a
# destroy, and a job that times out or whose runner is lost runs no more steps: the next run's
# first sweep deletes what they left, or run "sweep" by hand. The step timeouts of the round-trip job
# add up to 327 minutes with every plan, so its job timeout (350, under GitHub's 360) is never what
# stops a destroy (tests/sandbox-workflow.test.ts checks it). The state stays in the runner's
# temporary directory, which is never uploaded (the generated plans are, for a day, to carry them
# between the jobs); nothing here prints an output or an attribute value.
on:
  workflow_dispatch:
    inputs:
      plan:
        description: Plan to apply and destroy (all runs the four in turn; sweep deletes what an earlier run left and nothing more)
        type: choice
        options: [all, gcp-serverless, gcp-site, gcp-platform, gcp-data, sweep]
        default: all

permissions: {}

# One run at a time: the plans share the project, and a sweep must never find another run's resources.
concurrency:
  group: sandbox-google
  cancel-in-progress: false

jobs:
  # Dependencies installed without their install scripts, the plans generated and written to an artifact.
  # No token can be had here: no id-token permission, and no environment, so none of its variables.
  plans:
    name: plans
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Generate the plans
        run: scripts/sandbox-gcp.sh generate

      # The digest goes in this job's summary, for the reviewer; the round-trip job checks the plans itself.
      - name: Check the plans
        run: scripts/sandbox-gcp.sh validate

      - name: What the plans change
        run: |
          {
            echo "### Changes for a sandbox project"
            echo
            echo "If the round-trip job is cancelled, times out or loses its runner before its last step, the next run's first sweep (or the plan \`sweep\`) deletes what it left."
            echo
            scripts/sandbox-gcp.sh summary
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-gcp-plans
          path: ${{ runner.temp }}/sandbox-gcp
          retention-days: 1
          if-no-files-found: error

  round-trip:
    name: round-trip (${{ inputs.plan }})
    needs: plans
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      contents: read
      id-token: write # OpenID Connect, for the service account
    timeout-minutes: 350
    env:
      GOOGLE_PROJECT_ID: ${{ vars.GOOGLE_PROJECT_ID }}
      GOOGLE_REGION: ${{ vars.GOOGLE_REGION || 'europe-west2' }}
    steps:
      # Nothing is installed in this job (the id-token request variables are set for all of its steps):
      # the scripts it runs are this repository's, and the plans are the first job's artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.plan != 'sweep'
        with:
          name: sandbox-gcp-plans
          path: ${{ runner.temp }}/sandbox-gcp

      # Before a token can be asked for and before Terraform runs: the plans are the first job's, which ran
      # this repository's dependencies. A plan that is anything but what the generator writes stops the job.
      - name: Check the plans
        if: inputs.plan != 'sweep'
        timeout-minutes: 2
        run: scripts/sandbox-gcp.sh validate

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # A credentials file for the service account: a workload identity federation configuration that
      # trades the job's GitHub ID token, which it fetches again when it needs to, for the account's
      # tokens. No key, and nothing exported: each step names the file it signs in with. The file is in
      # the workspace, which isn't uploaded, and is deleted when the job ends.
      - name: Sign in
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: false

      # Before anything is changed: a plan may attach any service account of the project to what it
      # creates, so none may hold Editor or Owner. Every step that changes the project needs this to have
      # passed, always() steps included.
      - name: No service account holds Editor or Owner
        id: preflight
        timeout-minutes: 5
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: scripts/sandbox-gcp.sh preflight

      # What an earlier run may have left: the project holds nothing named after the sandbox between runs.
      - name: Sweep what an earlier run left
        timeout-minutes: 30
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: scripts/sandbox-gcp.sh sweep

      # Each plan: apply, check, destroy. An apply or a check that fails does not stop the others, and
      # the destroy runs whatever happened; the last step fails the job if any plan failed.
      - name: Apply gcp-serverless
        id: apply-serverless
        if: inputs.plan == 'all' || inputs.plan == 'gcp-serverless'
        continue-on-error: true
        timeout-minutes: 20
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: scripts/sandbox-gcp.sh apply gcp-serverless
      - name: Check gcp-serverless
        id: smoke-serverless
        if: steps.apply-serverless.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: scripts/sandbox-gcp.sh smoke gcp-serverless
      - name: Destroy gcp-serverless
        id: destroy-serverless
        if: always() && steps.preflight.outcome == 'success' && (inputs.plan == 'all' || inputs.plan == 'gcp-serverless')
        continue-on-error: true
        timeout-minutes: 20
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: scripts/sandbox-gcp.sh destroy gcp-serverless

      - name: Apply gcp-site
        id: apply-site
        if: always() && steps.preflight.outcome == 'success' && (inputs.plan == 'all' || inputs.plan == 'gcp-site')
        continue-on-error: true
        timeout-minutes: 20
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: scripts/sandbox-gcp.sh apply gcp-site
      - name: Check gcp-site
        id: smoke-site
        if: steps.apply-site.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: scripts/sandbox-gcp.sh smoke gcp-site
      - name: Destroy gcp-site
        id: destroy-site
        if: always() && steps.preflight.outcome == 'success' && (inputs.plan == 'all' || inputs.plan == 'gcp-site')
        continue-on-error: true
        timeout-minutes: 20
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: scripts/sandbox-gcp.sh destroy gcp-site

      - name: Apply gcp-platform
        id: apply-platform
        if: always() && steps.preflight.outcome == 'success' && (inputs.plan == 'all' || inputs.plan == 'gcp-platform')
        continue-on-error: true
        timeout-minutes: 35
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: scripts/sandbox-gcp.sh apply gcp-platform
      - name: Check gcp-platform
        id: smoke-platform
        if: steps.apply-platform.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: scripts/sandbox-gcp.sh smoke gcp-platform
      - name: Destroy gcp-platform
        id: destroy-platform
        if: always() && steps.preflight.outcome == 'success' && (inputs.plan == 'all' || inputs.plan == 'gcp-platform')
        continue-on-error: true
        timeout-minutes: 35
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: scripts/sandbox-gcp.sh destroy gcp-platform

      - name: Apply gcp-data
        id: apply-data
        if: always() && steps.preflight.outcome == 'success' && (inputs.plan == 'all' || inputs.plan == 'gcp-data')
        continue-on-error: true
        timeout-minutes: 45
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: scripts/sandbox-gcp.sh apply gcp-data
      - name: Check gcp-data
        id: smoke-data
        if: steps.apply-data.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: scripts/sandbox-gcp.sh smoke gcp-data
      - name: Destroy gcp-data
        id: destroy-data
        if: always() && steps.preflight.outcome == 'success' && (inputs.plan == 'all' || inputs.plan == 'gcp-data')
        continue-on-error: true
        timeout-minutes: 45
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: scripts/sandbox-gcp.sh destroy gcp-data

      # Whatever happened: deletes what the state didn't hold, such as a resource whose creation
      # failed half-way, and fails if anything named after the sandbox is left.
      - name: Sweep the project
        id: sweep
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: scripts/sandbox-gcp.sh sweep

      - name: Result
        if: always()
        env:
          OUTCOMES: >-
            ${{ steps.apply-serverless.outcome }} ${{ steps.smoke-serverless.outcome }} ${{ steps.destroy-serverless.outcome }}
            ${{ steps.apply-site.outcome }} ${{ steps.smoke-site.outcome }} ${{ steps.destroy-site.outcome }}
            ${{ steps.apply-platform.outcome }} ${{ steps.smoke-platform.outcome }} ${{ steps.destroy-platform.outcome }}
            ${{ steps.apply-data.outcome }} ${{ steps.smoke-data.outcome }} ${{ steps.destroy-data.outcome }}
            ${{ steps.sweep.outcome }} ${{ steps.preflight.outcome }}
        run: |
          case " $OUTCOMES " in
            *" failure "* | *" cancelled "*)
              echo "::error::A step failed: $OUTCOMES"
              exit 1
              ;;
          esac
          echo "Every step that ran succeeded."
