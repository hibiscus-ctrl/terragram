name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref. Keyed by workflow+ref (not a hardcoded
# prefix) so a second workflow added here can never collide with this one's group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN: nothing by default, and each job grants only the
# read scopes it uses. No job here writes anything (a trust-first product holds
# its own CI to the bar it publishes).
#
# Public-repo safe: `pull_request` only (never `pull_request_target`), and every
# checkout drops its credentials. Every dependency is on the public npm registry, so
# a fork PR's `npm ci` needs no token.
permissions: {}

jobs:
  verify:
    name: Typecheck · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      # `typecheck:all`: the tests and the release gates in scripts/ (the root
      # tsconfig), then the engine, the CLI and the Action, each on its own terms.
      - name: Typecheck (tests + scripts + engine + CLI + Action)
        run: npm run typecheck:all

      - name: Unit tests (with coverage floor)
        # Runs the whole suite and then fails if coverage of the engine and the CLI
        # drops below the floor in package.json. A drop here means logic lost a test.
        run: npm run test:coverage

  # The generated-Terraform gate: every brief and template, every generated cloud, through
  # terraform fmt/init/validate, the three scanners (tflint/trivy/checkov run in
  # their pinned containers here — the runner has Docker), and Infraweaver's own
  # assess, then every module call against its published interface. This is
  # the check that the engine's output is Terraform a reviewer can apply; it
  # needs the registry, so it is its own job and does not gate the unit tests.
  generated-terraform:
    name: Generated Terraform (fmt · validate · scanners · assess · modules)
    runs-on: ubuntu-latest
    # Forty documents' worth of work: twenty `terraform init`s (the Azure ones
    # fetch twenty Verified Modules each), three container scanners, and one
    # Infraweaver assess per document. The gate caches providers within a run;
    # this is the ceiling for a cold one, not the expected time.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Emit gate
        run: npm run validate:emit
        env:
          TF_IN_AUTOMATION: "1"
          # tflint --init fetches the Google ruleset from GitHub; signed in, the shared runner IP's rate limit does not apply.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Module interfaces
        run: npm run check:modules

  # What a user installs rather than what runs from the repo: the generated JSON
  # Schemas are current, the CLI bundles into one file that runs on a bare Node with
  # no @infraweaver-io import left in it, the engine builds as ESM + declarations,
  # and the CLI's output equals the engine's emit path (terraform fmt included). The
  # unit-test job runs these tests too, without Terraform installed; this one
  # installs it so the fmt check is not skipped.
  packages:
    name: Packages (schemas · CLI bundle · engine build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # schemas/ is generated from the engine's zod schemas; a stale file fails here.
      - name: Schemas are current
        run: npm run schemas:check

      - name: Build the CLI bundle and the engine library
        run: npm run build:packages

      # The bundle and library tests, the CLI-against-the-engine comparison and the
      # schema validation, on the freshly built packages.
      - name: Package tests
        run: npm run test:packages

      - name: CLI smoke test
        run: node packages/cli/dist/terragram.mjs --version

  # A workflow runs the Action from the bundle committed at action/dist, not from the
  # source beside it, so a source change that did not rebuild the bundle would ship
  # nothing. Rebuild it here and fail on any difference.
  action-dist:
    name: Action bundle is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Rebuild action/dist
        run: npm run build:action
      - name: Fail if the committed bundle differs
        run: git diff --exit-code -- action/dist

  lint:
    name: Lint (Biome · oxlint · lockfile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # `biome ci`: the read-only, CI-reporting form of `biome check`.
      - run: npm run lint:ci

      # Catches what Biome does not (oxlint's correctness rules). Config in
      # .oxlintrc.json — errors gate, warnings are advisory.
      - run: npm run lint:ox

      # Every resolved package comes from the public registry or GitHub Packages,
      # over https, with an integrity hash and a URL that matches its name.
      - run: npm run lint:lockfile

      # Import gate (.dependency-cruiser.cjs): no cycles, the engine's dependency
      # allow-list, and no npm import in the CLI or the Action (their bundles carry
      # none), plus the engine-reads-no-environment check.
      - run: npm run check:imports

      # Unused files, exports and dependencies (knip.json). An export kept for a
      # consumer that does not exist yet carries an `@public` tag saying which.
      - run: npm run knip

  # Every file has a copyright and a licence, from its own SPDX header or from
  # REUSE.toml, and every licence used is in LICENSES/ (REUSE spec 3.3).
  licences:
    name: Licences (reuse lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: reuse lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  # Mechanically enforce the SHA-pinning discipline: pinact validates every
  # third-party `uses:` is pinned to a full commit SHA (.pinact.yaml holds the
  # one justified exception). check-only (skip_push + fix:false) — it never commits.
  pinact:
    name: Action SHA pinning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: suzuki-shunsuke/pinact-action@b1a1f46bb10f2908950d95f626ca8cc109e2cf7d # v3.1.0
        with:
          skip_push: "true"
          fix: "false"
          # the version comment beside each SHA must name the tag that SHA
          # actually carries.
          verify: "true"
