# Trivy secret findings that are known test-only values, and nothing else.
#
# Read by the Trivy steps of .github/workflows/security-scan.yml through `--ignorefile`. Every
# entry names ONE rule and the EXACT file that holds the value, so a real credential of the same
# kind committed anywhere else (or a different kind in these files) still fails the scan. Do not
# widen a path to a directory or a glob, and do not add an entry without a reason.
secrets:
  # The redaction tests feed synthetic secret-shaped strings to the log redactor and assert that
  # they come out masked. Neither is a live credential.
  - id: github-app-token
    paths:
      - "tests/logger.test.ts"
      - "tests/log-redaction.test.ts"
    statement: Synthetic GitHub App token that the redaction tests mask.

  # The SES test configures the mailer with a placeholder key id and checks that it signs with it.
  - id: aws-access-key-id
    paths:
      - "tests/send-email.test.ts"
    statement: Placeholder AWS access key id for the SES request-signing test; it belongs to no account.
