  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

adding:20px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;font-family:'Source Sans 3',sans-serif;display:flex;flex-direction:column;min-height:172px;\" style-hover=\"border-color:#211D16;box-shadow:0 10px 26px rgba(46,38,24,.1);transform:translateY(-3px);\">\n                <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:15px;\">\n                  <span style=\"{{ md.fromChip }}\">{{ md.fromLabel }}<\u002Fspan>\n                  <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#A39A88\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><polyline points=\"13 6 19 12 13 18\"><\u002Fpolyline><\u002Fsvg>\n                  <span style=\"{{ md.toChip }}\">{{ md.toLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-weight:700;font-size:16px;margin-bottom:6px;letter-spacing:-.2px;\">{{ md.title }}<\u002Fdiv>\n                <div style=\"color:#6E6759;font-size:13px;line-height:1.5;flex:1;\">{{ md.desc }}<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:6px;margin-top:14px;font-size:13px;font-weight:600;color:#A8512A;\">Start <span style=\"font-size:14px;\">→<\u002Fspan><\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- used by strip -->\n        <section style=\"border-top:1px solid #EDE8DC;border-bottom:1px solid #EDE8DC;background:#fff;\">\n          <div style=\"max-width:1120px;margin:0 auto;padding:22px 32px;display:flex;align-items:center;gap:28px;flex-wrap:wrap;\">\n            <span style=\"font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:#A39A88;\">Built for teams across<\u002Fspan>\n            <sc-for list=\"{{ usedBy }}\" as=\"u\" hint-placeholder-count=\"5\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:#5D5647;font-weight:500;\">{{ u }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- how it works -->\n        <section id=\"how\" style=\"max-width:1120px;margin:0 auto;padding:72px 32px;\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#A8512A;letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px;\">How it works<\u002Fdiv>\n          <h2 style=\"font-size:34px;letter-spacing:-.8px;margin:0 0 14px;font-weight:700;\">Three steps, one source of truth.<\u002Fh2>\n          <p style=\"font-size:16.5px;color:#665E4F;margin:0 0 42px;max-width:560px;line-height:1.5;\">Everything flows through one internal model — so your words, your diagram, and your code never drift apart.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;\">\n            <sc-for list=\"{{ howSteps }}\" as=\"h\" hint-placeholder-count=\"3\">\n              <div style=\"border:1px solid #E9E3D7;border-radius:14px;background:#fff;padding:26px;\">\n                <div style=\"width:38px;height:38px;border-radius:10px;background:{{ h.tint }};color:{{ h.color }};display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:600;font-size:15px;margin-bottom:18px;\">{{ h.num }}<\u002Fdiv>\n                <div style=\"font-weight:700;font-size:18px;margin-bottom:8px;\">{{ h.title }}<\u002Fdiv>\n                <div style=\"font-size:14.5px;color:#665E4F;line-height:1.55;\">{{ h.body }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- bidirectional -->\n        <section style=\"background:#211D16;color:#fff;\">\n          <div style=\"max-width:1120px;margin:0 auto;padding:72px 32px;\">\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;\">\n              <div>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#A78BFA;letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px;\">Bidirectional<\u002Fdiv>\n                <h2 style=\"font-size:32px;letter-spacing:-.8px;margin:0 0 16px;font-weight:700;\">Translate in any direction.<\u002Fh2>\n                <p style=\"font-size:16px;color:#BFB7A9;line-height:1.6;margin:0 0 24px;\">Start from a sentence, a diagram, or existing code. InfraGraph keeps all three in sync and lets you target AWS or Azure from the same model.<\u002Fp>\n                <div style=\"display:flex;flex-direction:column;gap:12px;\">\n                  <sc-for list=\"{{ biPoints }}\" as=\"b\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex;gap:11px;align-items:flex-start;\">\n                      <span style=\"width:20px;height:20px;border-radius:50%;background:#2E2921;color:#7FD6A8;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px;\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size:15px;color:#E9E3D7;line-height:1.5;\">{{ b }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;justify-content:center;gap:14px;\">\n                <sc-for list=\"{{ triad }}\" as=\"t\" hint-placeholder-count=\"3\">\n                  <div style=\"flex:1;border:1px solid #3A342B;background:#2B2620;border-radius:13px;padding:22px 16px;text-align:center;\">\n                    <div style=\"color:{{ t.color }};margin-bottom:10px;display:flex;justify-content:center;\">{{ t.icon }}<\u002Fdiv>\n                    <div style=\"font-weight:600;font-size:14.5px;margin-bottom:4px;\">{{ t.label }}<\u002Fdiv>\n                    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#8B8372;\">{{ t.sub }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- inclusivity -->\n        <section id=\"inclusive\" style=\"max-width:1120px;margin:0 auto;padding:72px 32px;\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#B45309;letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px;\">Designed for everyone<\u002Fdiv>\n          <h2 style=\"font-size:34px;letter-spacing:-.8px;margin:0 0 14px;font-weight:700;\">Infrastructure shouldn't require a specialist.<\u002Fh2>\n          <p style=\"font-size:16.5px;color:#665E4F;margin:0 0 42px;max-width:620px;line-height:1.55;\">Whether you run a hospital trust's platform team or you're a community group standing up your first service, InfraGraph meets you where you are — accessible, in plain language, and free for public-sector and community use.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:16px;\">\n            <sc-for list=\"{{ inclusive }}\" as=\"i\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;gap:14px;align-items:flex-start;border:1px solid #E9E3D7;border-radius:13px;background:#fff;padding:22px;\">\n                <div style=\"width:40px;height:40px;border-radius:10px;background:{{ i.tint }};color:{{ i.color }};display:flex;align-items:center;justify-content:center;flex:none;\">{{ i.icon }}<\u002Fdiv>\n                <div>\n                  <div style=\"font-weight:700;font-size:16px;margin-bottom:5px;\">{{ i.title }}<\u002Fdiv>\n                  <div style=\"font-size:14px;color:#665E4F;line-height:1.5;\">{{ i.body }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- security -->\n        <section id=\"security\" style=\"background:#F4FCF8;border-top:1px solid #DCF0E6;border-bottom:1px solid #DCF0E6;\">\n          <div style=\"max-width:1120px;margin:0 auto;padding:64px 32px;\">\n            <div style=\"display:grid;grid-template-columns:1fr 1.2fr;gap:48px;align-items:center;\">\n              <div>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#047857;letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px;\">Trust &amp; compliance<\u002Fdiv>\n                <h2 style=\"font-size:32px;letter-spacing:-.8px;margin:0 0 14px;font-weight:700;\">Auditable by design.<\u002Fh2>\n                <p style=\"font-size:16px;color:#3F6151;line-height:1.6;margin:0;\">Every generation carries a signed evidence bundle, an SBOM, and the plan it was based on — so reviews, governance, and audits have what they need without extra work.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;\">\n                <sc-for list=\"{{ trustCards }}\" as=\"c\" hint-placeholder-count=\"4\">\n                  <div style=\"border:1px solid #C6F0DC;background:#fff;border-radius:12px;padding:18px;\">\n                    <div style=\"font-size:13px;font-weight:600;color:#047857;margin-bottom:4px;\">{{ c.label }}<\u002Fdiv>\n                    <div style=\"font-size:15px;font-weight:700;\">{{ c.value }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- who -->\n        <section id=\"who\" style=\"background:#F7EFE6;border-top:1px solid #EFE2D2;border-bottom:1px solid #EFE2D2;\">\n          <div style=\"max-width:1120px;margin:0 auto;padding:76px 32px;\">\n            <div style=\"max-width:640px;margin-bottom:44px;\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#9A4420;letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px;\">Who it's for<\u002Fdiv>\n              <h2 style=\"font-size:34px;letter-spacing:-.8px;margin:0 0 14px;font-weight:700;\">Built for the public sector. Open to everyone.<\u002Fh2>\n              <p style=\"font-size:16.5px;color:#6B5F4E;margin:0;line-height:1.55;\">InfraGraph started with NHS and government platform teams — but the same plain-English approach works for anyone who needs to stand up cloud infrastructure they can trust.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;\">\n              <sc-for list=\"{{ audienceCards }}\" as=\"a\" hint-placeholder-count=\"6\">\n                <div style=\"background:#fff;border:1px solid #EADFCE;border-radius:15px;padding:24px;transition:transform .15s,box-shadow .15s;\" style-hover=\"transform:translateY(-3px);box-shadow:0 12px 28px rgba(46,38,24,.09);\">\n                  <div style=\"width:44px;height:44px;border-radius:12px;background:{{ a.tint }};color:{{ a.color }};display:flex;align-items:center;justify-content:center;margin-bottom:16px;\">{{ a.icon }}<\u002Fdiv>\n                  <div style=\"font-weight:700;font-size:16.5px;margin-bottom:6px;letter-spacing:-.2px;\">{{ a.title }}<\u002Fdiv>\n                  <div style=\"font-size:14px;color:#6B5F4E;line-height:1.55;\">{{ a.body }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- final cta -->\n        <section style=\"max-width:1120px;margin:0 auto;padding:0 32px 72px;\">\n          <div style=\"border-radius:20px;background:#211D16;color:#fff;padding:56px 48px;text-align:center;\">\n            <h2 style=\"font-size:34px;letter-spacing:-.8px;margin:0 0 12px;font-weight:700;\">From idea to infrastructure in minutes.<\u002Fh2>\n            <p style=\"font-size:17px;color:#BFB7A9;margin:0 0 28px;\">No setup. No Terraform knowledge needed. Free for public-sector and community teams.<\u002Fp>\n            <button onclick=\"{{ openApp }}\" style=\"background:#E8965F;color:#2B1D10;border:none;border-radius:10px;padding:15px 30px;font-weight:700;font-size:16px;cursor:pointer;font-family:'Source Sans 3',sans-serif;\">Open the workspace →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <\u002Fsc-if>\n        <!-- ========== END LANDING ========== -->\n\n        <!-- ========== PRICING ========== -->\n        <sc-if value=\"{{ isPricing }}\" hint-placeholder-val=\"\">\n          <section style=\"max-width:1120px;margin:0 auto;padding:72px 32px 24px;text-align:center;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#9A4420;letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px;\">Pricing<\u002Fdiv>\n            <h1 style=\"font-size:42px;letter-spacing:-1.1px;margin:0 0 14px;font-weight:700;\">Free for public good. Fair for everyone else.<\u002Fh1>\n            <p style=\"font-size:17.5px;color:#665E4F;margin:0 auto;max-width:560px;line-height:1.5;\">The public sector, charities and learners use InfraGraph free. Commercial teams pay only for code generation and collaboration.<\u002Fp>\n          <\u002Fsection>\n          <section style=\"max-width:1120px;margin:0 auto;padding:24px 32px 40px;\">\n            <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start;\">\n              <sc-for list=\"{{ plans }}\" as=\"p\" hint-placeholder-count=\"3\">\n                <div style=\"{{ p.cardStyle }}\">\n                  <sc-if value=\"{{ p.highlight }}\" hint-placeholder-val=\"\"><div style=\"position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:#A8512A;color:#fff;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border-radius:20px;padding:4px 12px;\">Most popular<\u002Fdiv><\u002Fsc-if>\n                  <div style=\"font-weight:700;font-size:18px;margin-bottom:4px;\">{{ p.name }}<\u002Fdiv>\n                  <div style=\"font-size:13px;color:#8A8171;margin-bottom:18px;\">{{ p.tag }}<\u002Fdiv>\n                  <div style=\"display:flex;align-items:baseline;gap:6px;margin-bottom:20px;\"><span style=\"font-size:38px;font-weight:700;letter-spacing:-1px;\">{{ p.price }}<\u002Fspan><span style=\"font-size:14px;color:#8A8171;\">{{ p.per }}<\u002Fspan><\u002Fdiv>\n                  <button onclick=\"{{ p.ctaFn }}\" style=\"{{ p.ctaStyle }}\">{{ p.cta }}<\u002Fbutton>\n                  <div style=\"height:1px;background:#EDE7DB;margin:20px 0;\"><\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:11px;\">\n                    <sc-for list=\"{{ p.feat }}\" as=\"ft\" hint-placeholder-count=\"5\">\n                      <div style=\"display:flex;gap:10px;align-items:flex-start;font-size:14px;color:#4A4335;line-height:1.4;\"><span style=\"color:#059669;flex:none;margin-top:1px;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan>{{ ft }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top:26px;text-align:center;font-size:14px;color:#8A8171;\">Public-sector and charity verification is handled during onboarding — no card required for the Community plan.<\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <!-- ========== ABOUT ========== -->\n        <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"\">\n          <section style=\"max-width:820px;margin:0 auto;padding:76px 32px 40px;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#9A4420;letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px;\">About<\u002Fdiv>\n            <h1 style=\"font-size:40px;letter-spacing:-1px;margin:0 0 18px;font-weight:700;line-height:1.08;\">We think infrastructure should be something anyone can describe.<\u002Fh1>\n            <p style=\"font-size:18px;color:#5D5647;line-height:1.6;margin:0;\">InfraGraph began inside NHS platform teams who were spending more time writing Terraform than deciding what to build. We set out to close the gap between an idea, a diagram, and compliant, auditable code — in any direction.<\u002Fp>\n          <\u002Fsection>\n          <section style=\"border-top:1px solid #EDE8DC;border-bottom:1px solid #EDE8DC;background:#fff;\">\n            <div style=\"max-width:1000px;margin:0 auto;padding:44px 32px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;\">\n              <sc-for list=\"{{ aboutStats }}\" as=\"st\" hint-placeholder-count=\"4\">\n                <div><div style=\"font-size:32px;font-weight:700;letter-spacing:-.8px;color:#9A4420;\">{{ st.value }}<\u002Fdiv><div style=\"font-size:13.5px;color:#665E4F;margin-top:4px;\">{{ st.label }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n          <section style=\"max-width:1000px;margin:0 auto;padding:64px 32px;\">\n            <h2 style=\"font-size:26px;letter-spacing:-.6px;margin:0 0 28px;font-weight:700;\">What we believe<\u002Fh2>\n            <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:18px;\">\n              <sc-for list=\"{{ aboutValues }}\" as=\"v\" hint-placeholder-count=\"3\">\n                <div style=\"border:1px solid #E9E3D7;border-radius:14px;background:#fff;padding:24px;\">\n                  <div style=\"font-weight:700;font-size:16.5px;margin-bottom:8px;\">{{ v.title }}<\u002Fdiv>\n                  <div style=\"font-size:14px;color:#665E4F;line-height:1.55;\">{{ v.body }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <!-- ========== DOCS ========== -->\n        <sc-if value=\"{{ isDocs }}\" hint-placeholder-val=\"\">\n          <div style=\"max-width:1120px;margin:0 auto;padding:48px 32px 64px;display:grid;grid-template-columns:236px 1fr;gap:44px;\">\n            <aside style=\"align-self:start;position:sticky;top:88px;\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:#A39A88;margin-bottom:14px;\">Documentation<\u002Fdiv>\n              <sc-for list=\"{{ docsGroups }}\" as=\"g\" hint-placeholder-count=\"4\">\n                <div style=\"margin-bottom:20px;\">\n                  <div style=\"font-size:13px;font-weight:700;color:#211D16;margin-bottom:8px;\">{{ g.title }}<\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:2px;border-left:1px solid #E6E0D3;\">\n                    <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n                      <a href=\"#\" style=\"font-size:13.5px;color:#665E4F;padding:4px 0 4px 12px;margin-left:-1px;border-left:1px solid transparent;\" style-hover=\"color:#211D16;border-left-color:#A8512A;\">{{ it }}<\u002Fa>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Faside>\n            <main style=\"min-width:0;\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#9A4420;letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px;\">Getting started<\u002Fdiv>\n              <h1 style=\"font-size:34px;letter-spacing:-.8px;margin:0 0 14px;font-weight:700;\">Quickstart<\u002Fh1>\n              <p style=\"font-size:16.5px;color:#5D5647;line-height:1.6;margin:0 0 28px;\">InfraGraph translates between plain English, architecture diagrams, and Terraform. Everything flows through one internal model, so the three never drift apart. Pick a direction and go.<\u002Fp>\n              <div style=\"border:1px solid #E9E3D7;border-radius:12px;overflow:hidden;margin-bottom:32px;\">\n                <div style=\"background:#211D16;color:#EAE4D8;font-family:'JetBrains Mono',monospace;font-size:13px;padding:10px 16px;\">1 · Choose a mode<\u002Fdiv>\n                <div style=\"padding:18px 16px;font-size:14.5px;color:#4A4335;line-height:1.6;\">From the workspace, choose one of four modes: <strong>Chat → Diagram<\u002Fstrong>, <strong>Chat → Terraform<\u002Fstrong>, <strong>Diagram → Terraform<\u002Fstrong>, or <strong>Terraform → Diagram<\u002Fstrong>. You can switch modes at any time from the workspace toolbar.<\u002Fdiv>\n              <\u002Fdiv>\n              <h2 style=\"font-size:22px;letter-spacing:-.5px;margin:0 0 12px;font-weight:700;\">Describe your architecture<\u002Fh2>\n              <p style=\"font-size:15.5px;color:#5D5647;line-height:1.6;margin:0 0 16px;\">In chat modes, describe what you need the way you would to a colleague. The model drafts a diagram node by node and flags anything it is unsure about.<\u002Fp>\n              <div style=\"background:#231F18;border-radius:12px;padding:16px 18px;font-family:'JetBrains Mono',monospace;font-size:13px;color:#CFC8B8;line-height:1.7;margin-bottom:28px;\"><span style=\"color:#8B8372;\"># prompt<\u002Fspan><br>A web app with a Postgres database and a Redis cache,<br>behind a CDN, with identity via Entra ID.<\u002Fdiv>\n              <h2 style=\"font-size:22px;letter-spacing:-.5px;margin:0 0 12px;font-weight:700;\">Review, then generate<\u002Fh2>\n              <p style=\"font-size:15.5px;color:#5D5647;line-height:1.6;margin:0 0 24px;\">Before any code is written, the review gate asks you to confirm low-confidence nodes and pick a target cloud. Generation produces Terraform / OpenTofu plus a signed evidence bundle, ready for a pull request.<\u002Fp>\n              <div style=\"display:flex;gap:12px;flex-wrap:wrap;\"><button onclick=\"{{ openApp }}\" style=\"background:#A8512A;color:#fff;border:none;border-radius:9px;padding:12px 20px;font-weight:600;font-size:14.5px;cursor:pointer;font-family:'Source Sans 3',sans-serif;\">Open the workspace →<\u002Fbutton><button onclick=\"{{ goFaq }}\" style=\"background:#fff;color:#211D16;border:1px solid #DAD3C4;border-radius:9px;padding:12px 20px;font-weight:600;font-size:14.5px;cursor:pointer;font-family:'Source Sans 3',sans-serif;\">Read the FAQ<\u002Fbutton><\u002Fdiv>\n            <\u002Fmain>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ========== FAQ ========== -->\n        <sc-if value=\"{{ isFaq }}\" hint-placeholder-val=\"\">\n          <section style=\"max-width:800px;margin:0 auto;padding:72px 32px 32px;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#9A4420;letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px;\">FAQ<\u002Fdiv>\n            <h1 style=\"font-size:40px;letter-spacing:-1px;margin:0 0 14px;font-weight:700;\">Questions, answered.<\u002Fh1>\n            <p style=\"font-size:17px;color:#665E4F;margin:0;line-height:1.5;\">Everything teams usually ask before they start. Still unsure? <button onclick=\"{{ goContact }}\" style=\"background:none;border:none;color:#A8512A;font-weight:600;font-size:17px;cursor:pointer;font-family:'Source Sans 3',sans-serif;padding:0;text-decoration:underline;\">Talk to us<\u002Fbutton>.<\u002Fp>\n          <\u002Fsection>\n          <section style=\"max-width:800px;margin:0 auto;padding:20px 32px 64px;\">\n            <div style=\"display:flex;flex-direction:column;gap:12px;\">\n              <sc-for list=\"{{ faqItems }}\" as=\"f\" hint-placeholder-count=\"6\">\n                <div style=\"border:1px solid #E9E3D7;border-radius:13px;background:#fff;padding:20px 22px;\">\n                  <div style=\"font-weight:700;font-size:16.5px;margin-bottom:7px;\">{{ f.q }}<\u002Fdiv>\n                  <div style=\"font-size:14.5px;color:#665E4F;line-height:1.6;\">{{ f.a }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <!-- ========== CONTACT ========== -->\n        <sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"\">\n          <div style=\"max-width:1000px;margin:0 auto;padding:72px 32px 64px;display:grid;grid-template-columns:1fr 1fr;gap:52px;align-items:start;\">\n            <div>\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#9A4420;letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px;\">Contact<\u002Fdiv>\n              <h1 style=\"font-size:38px;letter-spacing:-1px;margin:0 0 16px;font-weight:700;line-height:1.1;\">Let's talk about your platform.<\u002Fh1>\n              <p style=\"font-size:16.5px;color:#5D5647;line-height:1.6;margin:0 0 28px;\">Whether you're procuring for an NHS trust or standing up your first service, we're happy to help you get started.<\u002Fp>\n              <div style=\"display:flex;flex-direction:column;gap:16px;\">\n                <div style=\"display:flex;gap:12px;align-items:center;\"><div style=\"width:38px;height:38px;border-radius:10px;background:#F7EBE0;color:#9A4420;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"m22 7-10 6L2 7\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-size:12px;color:#A39A88;\">Email<\u002Fdiv><div style=\"font-size:15px;font-weight:600;\">hello@infragraph.gov.uk<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                <div style=\"display:flex;gap:12px;align-items:center;\"><div style=\"width:38px;height:38px;border-radius:10px;background:#ECFDF5;color:#059669;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 4h16v16H4z\" opacity=\"0\"><\u002Fpath><path d=\"M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z\"><\u002Fpath><circle cx=\"12\" cy=\"9\" r=\"2.5\"><\u002Fcircle><\u002Fsvg><\u002Fdiv><div><div style=\"font-size:12px;color:#A39A88;\">Procurement<\u002Fdiv><div style=\"font-size:15px;font-weight:600;\">Available on G-Cloud 14<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                <div style=\"display:flex;gap:12px;align-items:center;\"><div style=\"width:38px;height:38px;border-radius:10px;background:#EFF4FE;color:#2563EB;display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 6v6l4 2\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"font-size:12px;color:#A39A88;\">Response time<\u002Fdiv><div style=\"font-size:15px;font-weight:600;\">Within one working day<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border:1px solid #E9E3D7;border-radius:16px;background:#fff;padding:26px;box-shadow:0 12px 32px rgba(46,38,24,.06);\">\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;\">\n                <div><label style=\"display:block;font-size:12px;font-weight:600;color:#7A7263;margin-bottom:6px;\">Name<\u002Flabel><input placeholder=\"Amara Okafor\" style=\"width:100%;border:1px solid #E6E0D3;border-radius:9px;padding:10px 12px;font-size:14px;font-family:'Source Sans 3',sans-serif;outline:none;\" style-focus=\"border-color:#211D16;\"><\u002Fdiv>\n                <div><label style=\"display:block;font-size:12px;font-weight:600;color:#7A7263;margin-bottom:6px;\">Organisation<\u002Flabel><input placeholder=\"NHS Trust\" style=\"width:100%;border:1px solid #E6E0D3;border-radius:9px;padding:10px 12px;font-size:14px;font-family:'Source Sans 3',sans-serif;outline:none;\" style-focus=\"border-color:#211D16;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <label style=\"display:block;font-size:12px;font-weight:600;color:#7A7263;margin-bottom:6px;\">Work email<\u002Flabel>\n              <input placeholder=\"a.okafor@nhs.net\" style=\"width:100%;border:1px solid #E6E0D3;border-radius:9px;padding:10px 12px;font-size:14px;font-family:'Source Sans 3',sans-serif;outline:none;margin-bottom:14px;\" style-focus=\"border-color:#211D16;\">\n              <label style=\"display:block;font-size:12px;font-weight:600;color:#7A7263;margin-bottom:6px;\">How can we help?<\u002Flabel>\n              <textarea rows=\"4\" placeholder=\"Tell us about your team and what you're building…\" style=\"width:100%;border:1px solid #E6E0D3;border-radius:9px;padding:10px 12px;font-size:14px;font-family:'Source Sans 3',sans-serif;outline:none;resize:none;margin-bottom:16px;\" style-focus=\"border-color:#211D16;\"><\u002Ftextarea>\n              <button onclick=\"{{ onOpenPR }}\" style=\"width:100%;background:#A8512A;color:#fff;border:none;border-radius:9px;padding:12px;font-weight:600;font-size:14.5px;cursor:pointer;font-family:'Source Sans 3',sans-serif;\">Send message<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ========== LEGAL (shared) ========== -->\n        <sc-if value=\"{{ isLegal }}\" hint-placeholder-val=\"\">\n          <article style=\"max-width:760px;margin:0 auto;padding:72px 32px 72px;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#9A4420;letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px;\">Legal<\u002Fdiv>\n            <h1 style=\"font-size:38px;letter-spacing:-1px;margin:0 0 10px;font-weight:700;\">{{ legal.title }}<\u002Fh1>\n            <div style=\"font-size:13px;color:#A39A88;font-family:'JetBrains Mono',monospace;margin-bottom:20px;\">Last updated {{ legal.updated }}<\u002Fdiv>\n            <p style=\"font-size:17px;color:#5D5647;line-height:1.6;margin:0 0 36px;padding-bottom:28px;border-bottom:1px solid #EDE8DC;\">{{ legal.intro }}<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:28px;\">\n              <sc-for list=\"{{ legal.sections }}\" as=\"sec\" hint-placeholder-count=\"4\">\n                <div>\n                  <h2 style=\"font-size:19px;letter-spacing:-.3px;margin:0 0 8px;font-weight:700;\">{{ sec.h }}<\u002Fh2>\n                  <p style=\"font-size:15.5px;color:#5D5647;line-height:1.65;margin:0;\">{{ sec.p }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top:40px;padding-top:24px;border-top:1px solid #EDE8DC;font-size:14px;color:#8A8171;\">Questions about this policy? <button onclick=\"{{ goContact }}\" style=\"background:none;border:none;color:#A8512A;font-weight:600;font-size:14px;cursor:pointer;font-family:'Source Sans 3',sans-serif;padding:0;text-decoration:underline;\">Contact us<\u002Fbutton>.<\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-if>\n\n        <!-- shared footer -->\n        <footer style=\"border-top:1px solid #EDE8DC;background:#211D16;color:#EAE4D8;\">\n          <div style=\"max-width:1120px;margin:0 auto;padding:52px 32px 28px;display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:32px;\">\n            <div>\n              <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px;\">\n                <div style=\"width:28px;height:28px;border-radius:7px;background:#fff;color:#211D16;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;\">IG<\u002Fdiv>\n                <span style=\"font-weight:700;font-size:16px;color:#fff;\">InfraGraph<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"font-size:13.5px;color:#A79F8E;line-height:1.55;margin:0 0 14px;max-width:260px;\">Plain English, diagrams and Terraform — one auditable model. Built for the UK public sector, open to everyone.<\u002Fp>\n              <div style=\"display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#A79F8E;background:#2B2620;border:1px solid #3A342B;border-radius:7px;padding:5px 10px;\"><span style=\"width:7px;height:7px;border-radius:50%;background:#34D399;\"><\u002Fspan>Data stays in the UK 🇬🇧<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ footerCols }}\" as=\"col\" hint-placeholder-count=\"3\">\n              <div>\n                <div style=\"font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#78715F;margin-bottom:14px;\">{{ col.title }}<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:10px;\">\n                  <sc-for list=\"{{ col.links }}\" as=\"lk\" hint-placeholder-count=\"4\">\n                    <button onclick=\"{{ lk.f }}\" style=\"background:none;border:none;text-align:left;padding:0;font-size:13.5px;color:#C4BCAB;cursor:pointer;font-family:'Source Sans 3',sans-serif;\" style-hover=\"color:#fff;\">{{ lk.t }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"max-width:1120px;margin:0 auto;padding:20px 32px;border-top:1px solid #322C24;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;\">\n            <span style=\"font-size:12.5px;color:#78715F;\">© 2026 InfraGraph. A UK public-benefit platform.<\u002Fspan>\n            <span style=\"font-size:12.5px;color:#78715F;font-family:'JetBrains Mono',monospace;\">WCAG 2.2 AA · Cyber Essentials Plus<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Ffooter>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ---------- START ---------- -->\n    <sc-if value=\"{{ isStart }}\" hint-placeholder-val=\"\">\n      <div style=\"height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:56px 24px 40px;\">\n        <div style=\"width:100%;max-width:880px;animation:igFade .4s ease;\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#7C3AED;letter-spacing:.5px;text-transform:uppercase;margin-bottom:14px;\">New workspace<\u002Fdiv>\n          <h1 style=\"font-size:38px;line-height:1.08;letter-spacing:-1px;margin:0 0 14px;font-weight:700;max-width:640px;\">What do you want to translate?<\u002Fh1>\n          <p style=\"font-size:17px;line-height:1.5;color:#665E4F;margin:0 0 32px;max-width:600px;\">Pick a direction. InfraGraph moves between plain English, diagrams and Terraform — all through one auditable model. You can switch modes any time.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;\">\n            <sc-for list=\"{{ modeStart }}\" as=\"md\" hint-placeholder-count=\"4\">\n              <div onclick=\"{{ md.onClick }}\" style=\"border:1px solid #E9E3D7;background:#fff;border-radius:14px;padding:22px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;\" style-hover=\"border-color:#211D16;box-shadow:0 6px 18px rgba(46,38,24,.08);transform:translateY(-2px);\">\n                <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:15px;\">\n                  <span style=\"{{ md.fromChip }}\">{{ md.fromLabel }}<\u002Fspan>\n                  <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#A39A88\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><polyline points=\"13 6 19 12 13 18\"><\u002Fpolyline><\u002Fsvg>\n                  <span style=\"{{ md.toChip }} ding:16px 0;border-bottom:1px solid #F3EFE6;\"><div><div style=\"font-weight:600;font-size:14.5px;\">Response detail<\u002Fdiv><div style=\"font-size:12.5px;color:#8A8171;\">How much the assistant explains each change.<\u002Fdiv><\u002Fdiv><select style=\"border:1px solid #E6E0D3;border-radius:9px;padding:9px 11px;font-size:13.5px;font-family:'Source Sans 3',sans-serif;outline:none;background:#fff;\"><option>Concise<\u002Foption><option>Balanced<\u002Foption><option>Detailed<\u002Foption><\u002Fselect><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid #F3EFE6;\"><div><div style=\"font-weight:600;font-size:14.5px;\">Ask before ambiguous changes<\u002Fdiv><div style=\"font-size:12.5px;color:#8A8171;\">Clarify when a request like \"a fast server\" is unclear.<\u002Fdiv><\u002Fdiv><span style=\"{{ toggleOn }}\"><span style=\"{{ toggleKnobOn }}\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid #F3EFE6;\"><div><div style=\"font-weight:600;font-size:14.5px;\">Starter suggestions<\u002Fdiv><div style=\"font-size:12.5px;color:#8A8171;\">Show example prompts on an empty workspace.<\u002Fdiv><\u002Fdiv><span style=\"{{ toggleOn }}\"><span style=\"{{ toggleKnobOn }}\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;justify-content:space-between;padding:16px 0;\"><div><div style=\"font-weight:600;font-size:14.5px;\">Streaming animation<\u002Fdiv><div style=\"font-size:12.5px;color:#8A8171;\">Draw nodes sequentially as the model responds.<\u002Fdiv><\u002Fdiv><span style=\"{{ toggleOn }}\"><span style=\"{{ toggleKnobOn }}\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ setIsDiagram }}\" hint-placeholder-val=\"\">\n              <h1 style=\"font-size:26px;letter-spacing:-.6px;margin:0 0 4px;font-weight:700;\">Diagramming<\u002Fh1>\n              <p style=\"font-size:14.5px;color:#665E4F;margin:0 0 24px;\">How diagrams are laid out, labelled and coloured.<\u002Fp>\n              <div style=\"background:#fff;border:1px solid #E9E3D7;border-radius:14px;padding:8px 20px;\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid #F3EFE6;\"><div><div style=\"font-weight:600;font-size:14.5px;\">Auto-layout<\u002Fdiv><div style=\"font-size:12.5px;color:#8A8171;\">Re-route and space nodes automatically as the model changes.<\u002Fdiv><\u002Fdiv><span style=\"{{ toggleOn }}\"><span style=\"{{ toggleKnobOn }}\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid #F3EFE6;\"><div><div style=\"font-weight:600;font-size:14.5px;\">Edge routing<\u002Fdiv><div style=\"font-size:12.5px;color:#8A8171;\">Connector style between nodes.<\u002Fdiv><\u002Fdiv><select style=\"border:1px solid #E6E0D3;border-radius:9px;padding:9px 11px;font-size:13.5px;font-family:'Source Sans 3',sans-serif;outline:none;background:#fff;\"><option>Orthogonal<\u002Foption><option>Straight<\u002Foption><option>Curved<\u002Foption><\u002Fselect><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid #F3EFE6;\"><div><div style=\"font-weight:600;font-size:14.5px;\">Label typeface<\u002Fdiv><div style=\"font-size:12.5px;color:#8A8171;\">Diagram labels match the code ecosystem.<\u002Fdiv><\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#5D5647;border:1px solid #E6E0D3;border-radius:8px;padding:7px 11px;background:#FAF8F4;\">JetBrains Mono · locked<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;justify-content:spac \"{{ closeSettings }}\" style=\"background:#211D16;color:#fff;border:none;border-radius:9px;padding:10px 22px;font-weight:600;font-size:14px;cursor:pointer;font-family:'Source Sans 3',sans-serif;\">Done<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  W = 158; H = 60;\n\n  palette = {\n    compute:  { stroke:'#2563EB', text:'#1E40AF', label:'Compute' },\n    storage:  { stroke:'#059669', text:'#047857', label:'Storage' },\n    network:  { stroke:'#7C3AED', text:'#6D28D9', label:'Network' },\n    identity: { stroke:'#D97706', text:'#B45309', label:'Identity' },\n    edge:     { stroke:'#7A7263', text:'#5D5647', label:'Edge' },\n  };\n\n  nodes = [\n    { id:'internet',   type:'edge',     x:360, y:18,  az:'Internet',             aws:'Internet' },\n    { id:'frontdoor',  type:'network',  x:360, y:124, az:'Front Door + WAF',     aws:'CloudFront + WAF' },\n    { id:'appservice', type:'compute',  x:360, y:230, az:'App Service Plan',     aws:'ECS Fargate' },\n    { id:'entra',      type:'identity', x:70,  y:230, az:'Entra ID',             aws:'Cognito' },\n    { id:'keyvault',   type:'identity', x:70,  y:372, az:'Key Vault',            aws:'Secrets Manager' },\n    { id:'redis',      type:'storage',  x:262, y:372, az:'Cache for Redis',      aws:'ElastiCache', flagged:true, note:'Cache SKU and size were not specified in the prompt.' },\n    { id:'postgres',   type:'storage',  x:438, y:372, az:'PostgreSQL Flexible',  aws:'RDS PostgreSQL', flagged:true, note:'Compute tier is ambiguous — confirm sizing before generating.' },\n    { id:'blob',       type:'storage',  x:614, y:372, az:'Blob Storage',         aws:'S3 Bucket' },\n  ];\n\n  edgesDef = [\n    ['internet','frontdoor'], ['frontdoor','appservice'],\n    ['appservice','entra'], ['appservice','keyvault'],\n    ['appservice','redis'], ['appservice','postgres'], ['appservice','blob'],\n  ];\n\n  deps = { frontdoor:['internet'], appservice:['frontdoor','internet'], entra:['appservice'], keyvault:['appservice'], redis:['appservice'], postgres:['appservice'], blob:['appservice'] };\n\n  intents = [\n    { ids:['redis'],    label:'a Redis cache',        kw:['redis','cache'] },\n    { ids:['postgres'], label:'a PostgreSQL database', kw:['postgres','postgresql','database',' db','sql','rds','datastore'] },\n    { ids:['blob'],     label:'object storage',        kw:['blob','object storage','s3','bucket','file storage','files'] },\n    { ids:['frontdoor'],label:'a CDN and WAF',         kw:['cdn','front door','frontdoor','waf','cloudfront','firewall','edge'] },\n    { ids:['entra'],    label:'identity',              kw:['entra','identity','auth','sso','login','cognito','authentication'] },\n    { ids:['keyvault'], label:'a secrets vault',       kw:['key vault','keyvault','secret','vault'] },\n    { ids:['appservice','frontdoor','internet'], label:'a web tier', kw:['web app','webapp','app service','web tier','application','api','server','website','web service','compute','microservice','backend','frontend'] },\n  ];\n\n  modes = {\n    'chat-diagram':      { from:'chat', to:'diagram', label:'Chat → Diagram', title:'Chat to Diagram', desc:'Describe your architecture and watch the diagram build itself.' },\n    'chat-terraform':    { from:'chat', to:'terraform', label:'Chat → Terraform', title:'Chat to Terraform', desc:'Describe it in plain English and get review-ready Terraform.' },\n    'diagram-terraform': { from:'diagram', to:'terraform', label:'Diagram → Terraform', title:'Diagram to Terraform', desc:'Upload a draw.io or Mermaid file and generate compliant IaC.' },\n    'terraform-diagram': { from:'terraform', to:'diagram', label:'Terraform → Diagram', title:'Terraform to Diagram', desc:'Paste existing Terraform and reverse-engineer the diagram.' },\n  };\n  sampleTf = `resource \"azurerm_service_plan\" \"web\" {\\n  name     = \"asp-web-prod\"\\n  os_type  = \"Linux\"\\n  sku_name = \"P1v3\"\\n}\\n\\nresource \"azurerm_postgresql_flexible_server\" \"db\" {\\n  name    = \"pg-infragraph-prod\"\\n  version = \"16\"\\n}\\n\\nresource \"azurerm_redis_cache\" \"cache\" {\\n  name     = \"redis-infragraph-prod\"\\n  sku_name = \"Standard\"\\n}`;\n\n  state = {\n    screen:'landing', mode:'chat-diagram', settingsOpen:false, demoOpen:false,\n    modeMenuOpen:false, userMenuOpen:false, startMenuOpen:false, settingsTab:'general', adminTab:'org',\n    cloud:'azure', inference:'managed', residency:'uksouth',\n    messages:[], draft:'', tfDraft:'', tfParsed:false, active:[], reveal:0, streaming:false,\n    selectedId:null, overrides:{}, resolved:{}, toast:'',\n    genState:null, forceTimeout:false, error:null,\n  };\n\n  componentWillUnmount(){ if(this._iv) clearInterval(this._iv); if(this._t) clearTimeout(this._t); if(this._g) clearTimeout(this._g); }\n\n  // ---- nav ----\n  go = (screen) => { if(this._iv) clearInterval(this._iv); this.setState({ screen, selectedId:null, demoOpen:false, modeMenuOpen:false, userMenuOpen:false, startMenuOpen:false }); };\n  goHome = () => this.go('landing');\n  goPricing = () => this.go('pricing');\n  goAbout = () => this.go('about');\n  goDocs = () => this.go('docs');\n  goFaq = () => this.go('faq');\n  goContact = () => this.go('contact');\n  goPrivacy = () => this.go('privacy');\n  goCookies = () => this.go('cookies');\n  goTerms = () => this.go('terms');\n  goConfidentiality = () => this.go('confidentiality');\n  goAdmin = () => this.go('admin');\n  goSettings = () => this.go('settings');\n  openApp = () => this.go('start');\n  tryDemo = () => { this.startDiagram('chat-diagram'); };\n  marketRef = (el) => { this._market = el; };\n  componentDidUpdate(pp, ps){ if(ps.screen!==this.state.screen && this._market){ this._market.scrollTop = 0; } }\n  toggleUserMenu = (e) => { if(e) e.stopPropagation(); this.setState(s=>({ userMenuOpen:!s.userMenuOpen, demoOpen:false })); };\n  toggleModeMenu = (e) => { if(e) e.stopPropagation(); this.setState(s=>({ modeMenuOpen:!s.modeMenuOpen })); };\n  toggleStartMenu = (e) => { if(e) e.stopPropagation(); this.setState(s=>({ startMenuOpen:!s.startMenuOpen })); };\n  setSettingsTab = (t) => () => this.setState({ settingsTab:t });\n  setAdminTab = (t) => () => this.setState({ adminTab:t });\n  openSettings = () => this.go('settings');\n  closeSettings = () => this.setState({ settingsOpen:false });\n  stop = (e) => { e.stopPropagation(); };\n  toggleDemo = () => this.setState(s => ({ demoOpen:!s.demoOpen }));\n  setManaged = () => this.setState({ inference:'managed' });\n  setByok = () => this.setState({ inference:'byok' });\n  onResidency = (e) => { const v=e.target.value; this.setState({ residency:v, cloud: v==='euwest2'?'aws':'azure' }); };\n  setAzure = () => this.setState({ cloud:'azure', residency: this.state.residency==='euwest2'?'uksouth':this.state.residency });\n  setAws = () => this.setState({ cloud:'aws', residency:'euwest2' });\n  showToast = (msg) => { this.setState({ toast:msg }); if(this._t) clearTimeout(this._t); this._t=setTimeout(()=>this.setState({toast:''}),2800); };\n\n  // ---- errors / demo ----\n  demoUnparse = () => this.setState({ error:'unparse', demoOpen:false });\n  dismissError = () => this.setState({ error:null });\n  errorToChat = () => { this.setState({ error:null }); this.startChat(); };\n  demoAmbiguous = () => { if(this._iv) clearInterval(this._iv); this.setState({ screen:'workspace', entryMode:'chat', demoOpen:false }); setTimeout(()=>this.doSend('Just make it really good and modern, nothing too fancy'), 80); };\n  demoTimeout = () => { this.setState({ demoOpen:false }); this.startGenerate(true); };\n\n  // ---- graph reveal ----\n  orderedActive(active){ return this.nodes.filter(n => active.includes(n.id)).map(n=>n.id); }\n  ensureWithDeps(ids){ const out=new Set(); const add=(id)=>{ if(out.has(id)) return; out.add(id); (this.deps[id]||[]).forEach(add); }; ids.forEach(add); return [...out]; }\n\n  pushAssistant = (text, conf) => this.setState(s => ({ messages:[...s.messages, { role:'assistant', text, conf }] }));\n  pushClarify = (text) => this.setState(s => ({ messages:[...s.messages, { role:'assistant', clarify:true, text }] }));\n\n  animateReveal = (target, ackText, conf) => {\n    if(this._iv) clearInterval(this._iv);\n    const start = this.state.reveal;\n    if(target <= start){ this.setState({ reveal:target, streaming:false }); if(ackText) setTimeout(()=>this.pushAssistant(ackText, conf), 320); return; }\n    this.setState({ streaming:true });\n    this._iv = setInterval(() => {\n      this.setState(s => { const next=s.reveal+1; if(next>=target){ clearInterval(this._iv); this._iv=null; return { reveal:target, streaming:false }; } return { reveal:next }; });\n    }, 240);\n    const stepN = target - start;\n    if(ackText) setTimeout(()=>this.pushAssistant(ackText, conf), stepN*240 + 380);\n  };\n\n  chooseMode = (mode) => { const m=this.modes[mode]; if(m.from==='chat') this.startChat(mode); else if(m.from==='diagram') this.startDiagram(mode); else this.startTerraform(mode); };\n  switchMode = (mode) => () => { this.setState({ modeMenuOpen:false }); this.chooseMode(mode); };\n  startChat = (mode) => { if(this._iv) clearInterval(this._iv); this.setState({ screen:'workspace', mode: typeof mode==='string'?mode:'chat-diagram', active:[], reveal:0, messages:[], selectedId:null, resolved:{}, overrides:{}, error:null, tfParsed:false }); };\n  startDiagram = (mode) => {\n    if(this._iv) clearInterval(this._iv);\n    const all = this.nodes.map(n=>n.id);\n    this.setState({ screen:'workspace', mode: typeof mode==='string'?mode:'diagram-terraform', active:all, reveal:0, selectedId:null, resolved:{}, overrides:{}, error:null, tfParsed:false,\n      messages:[{ role:'system', text:'Parsed architecture.drawio — 8 components, 7 connections detected.' }] });\n    this.animateReveal(all.length, 'Rendered an 8-component web architecture through the internal model. 2 nodes are low-confidence and flagged for review before code generation.', '92% confident · 2 flagged');\n  };\n  startTerraform = (mode) => {\n    if(this._iv) clearInterval(this._iv);\n    this.setState({ screen:'workspace', mode: typeof mode==='string'?mode:'terraform-diagram', active:[], reveal:0, selectedId:null, resolved:{}, overrides:{}, error:null, tfParsed:false, tfDraft:this.sampleTf,\n      messages:[{ role:'system', text:'Paste Terraform / OpenTofu on the left, then generate the diagram.' }] });\n  };\n  parseTerraform = () => {\n    if(this._iv) clearInterval(this._iv);\n    const all = this.nodes.map(n=>n.id);\n    this.setState(s => ({ active:all, reveal:0, tfParsed:true, messages:[...s.messages, { role:'system', text:'Parsed 8 resources from HCL — reconstructing diagram.' }] }));\n    this.animateReveal(all.length, 'Reconstructed the architecture from your Terraform. 8 resources mapped to the internal model.', '96% confident');\n  };\n  onTfDraft = (e) => this.setState({ tfDraft:e.target.value });\n  primaryAction = () => { const m=this.modes[this.state.mode]; if(m.to==='terraform') this.onGenerateCode(); else this.onExport(); };\n  openRecent = () => this.startDiagram('diagram-terraform');\n\n  parseIntent(text){\n    const t = ' ' + text.toLowerCase() + ' ';\n    const isRemove = /\\b(remove|delete|drop|without|get rid of|take out)\\b/.test(t);\n    let cloud = null;\n    if(/\\b(to |use |on |switch.*)?(aws|amazon)\\b/.test(t) && /(switch|move|use|on aws|to aws|amazon)/.test(t)) cloud='aws';\n    if(/\\b(to |use |on |switch.*)?(azure|microsoft)\\b/.test(t) && /(switch|move|use|on azure|to azure|azure)/.test(t)) cloud='azure';\n    const matched = [];\n    this.intents.forEach(it => { if(it.kw.some(k => t.includes(k))) matched.push(it); });\n    const vague = /\\b(fast|good|better|scalable|robust|modern|nice|best|something|stuff|thing|simple|cheap|secure|powerful)\\b/.test(t);\n    const ids = []; matched.forEach(it => it.ids.forEach(id => { if(!ids.includes(id)) ids.push(id); }));\n    return { isRemove, cloud, ids, matched, vague };\n  }\n\n  doSend = (txt) => {\n    const d = (txt||'').trim(); if(!d) return;\n    this.setState(s => ({ messages:[...s.messages, { role:'user', text:d }], draft:'' }));\n    const p = this.parseIntent(d);\n\n    // ambiguous: vague language and no concrete resource, no cloud switch\n    if(p.ids.length===0 && !p.cloud){\n      setTimeout(()=>this.pushClarify(p.vague\n        ? \"I want to get this right — that's a little open-ended. Are you after more compute, a managed database, or a caching layer? Pick one to add it to the model:\"\n        : \"I didn't catch a specific component in that. What would you like to add to the architecture?\"), 480);\n      return;\n    }\n\n    const s = this.state;\n    let active = [...s.active];\n    let cloud = s.cloud;\n    const parts = [];\n\n    if(p.cloud && p.cloud!==cloud){ cloud = p.cloud; parts.push('switched the target cloud to '+(cloud==='aws'?'AWS':'Azure')); }\n\n    if(p.ids.length){\n      if(p.isRemove){\n        const removed = p.ids.filter(id => active.includes(id));\n        active = active.filter(id => !p.ids.includes(id));\n        if(removed.length){ const labels = removed.map(id=>this.serviceNameFor(this.nodes.find(n=>n.id===id), cloud)); parts.push('removed '+this.joinList(labels)); }\n      } else {\n        const want = this.ensureWithDeps(p.ids);\n        const newly = want.filter(id => !active.includes(id));\n        active = this.orderedActive([...new Set([...active, ...want])]);\n        const addedLeaves = p.matched.flatMap(it => it.label);\n        if(newly.length){ parts.push('added '+this.joinList([...new Set(addedLeaves)])); }\n      }\n    }\n\n    active = this.orderedActive(active);\n    const flaggedActive = this.nodes.filter(n=>n.flagged && active.includes(n.id) && !this.state.resolved[n.id]).length;\n    const compN = active.filter(id=>this.nodes.find(n=>n.id===id).type!=='edge').length;\n    let ack = parts.length ? ('I\\u2019ve ' + this.joinList(parts) + '. The model now has ' + compN + ' component' + (compN===1?'':'s') + '.') : 'No changes needed — that\\u2019s already reflected in the model.';\n    const conf = flaggedActive>0 ? (flaggedActive + ' node' + (flaggedActive>1?'s':'') + ' flagged for review') : null;\n\n    this.setState({ active, cloud, residency: cloud==='aws'?'euwest2':(s.residency==='euwest2'?'uksouth':s.residency) });\n    // reveal newly added (target = active length). reveal currently maybe < length\n    const curReveal = Math.min(this.state.reveal, active.length);\n    this.setState({ reveal: curReveal });\n    this.animateReveal(active.length, ack, conf);\n  };\n  joinList(arr){ if(arr.length<=1) return arr[0]||''; if(arr.length===2) return arr[0]+' and '+arr[1]; return arr.slice(0,-1).join(', ')+' and '+arr[arr.length-1]; }\n  serviceNameFor(n, cloud){ return cloud==='azure'?n.az:n.aws; }\n\n  onSend = () => this.doSend(this.state.draft);\n  onDraft = (e) => this.setState({ draft:e.target.value });\n  onKey = (e) => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); this.onSend(); } };\n\n  onGenerateCode = () => { if(this.state.reveal < this.state.active.length || this.state.active.length<2) return; this.setState({ screen:'review', selectedId:null }); };\n  backToWorkspace = () => this.setState({ screen:'workspace', selectedId:null });\n  backToReview = () => this.setState({ screen:'review', genState:null });\n\n  startGenerate = (force) => {\n    if(this._g) clearTimeout(this._g);\n    this.setState({ screen:'generating', genState:'running', forceTimeout:force, selectedId:null });\n    this._g = setTimeout(() => {\n      if(this.state.forceTimeout){ this.setState({ genState:'timeout' }); }\n      else { this.setState({ screen:'output', genState:null }); }\n    }, 1900);\n  };\n  confirmReview = () => this.startGenerate(false);\n  retryGenerate = () => { this.setState({ forceTimeout:false }); this.startGenerate(false); };\n\n  selectNode = (id) => this.setState({ selectedId:id });\n  closeInspector = () => this.setState({ selectedId:null });\n  resolveNode = (id) => this.setState(s => ({ resolved:{ ...s.resolved, [id]:true } }));\n  updateField = (id, field, val) => this.setState(s => ({ overrides:{ ...s.overrides, [id]:{ ...(s.overrides[id]||{}), [field]:val } }, resolved:{ ...s.resolved, [id]:true } }));\n\n  onInvite = () => this.showToast('Invitation sent to your new member.');\n  onDisconnect = () => this.showToast('GitHub connection settings opened.');\n  onConnectGitlab = () => this.showToast('Redirecting to GitLab to authorise…');\n  onOpenPR = () => this.showToast('Pull request #142 opened — signed evidence bundle attached.');\n  onDownload = () => this.showToast('Downloaded infragraph-terraform.zip');\n  onExport = () => this.showToast('Exported diagram as architecture.drawio');\n\n  // ---- helpers ----\n  serviceName(n){ const o=this.state.overrides[n.id]; if(o&&o.service) return o.service; return this.state.cloud==='azure'?n.az:n.aws; }\n  isFlagged(n){ return !!n.flagged && !this.state.resolved[n.id]; }\n\n  azFrag = {\n    frontdoor:`resource \"azurerm_cdn_frontdoor_profile\" \"edge\" {\\n  name      = \"fd-infragraph-prod\"\\n  sku_name  = \"Premium_AzureFrontDoor\"\\n}`,\n    appservice:`resource \"azurerm_service_plan\" \"web\" {\\n  name     = \"asp-web-prod\"\\n  os_type  = \"Linux\"\\n  sku_name = \"P1v3\"\\n}`,\n    postgres:`resource \"azurerm_postgresql_flexible_server\" \"db\" {\\n  name     = \"pg-infragraph-prod\"\\n  version  = \"16\"\\n  sku_name = \"GP_Standard_D2s_v3\"\\n}`,\n    redis:`resource \"azurerm_redis_cache\" \"cache\" {\\n  name     = \"redis-infragraph-prod\"\\n  sku_name = \"Standard\"\\n  capacity = 1\\n}`,\n    blob:`resource \"azurerm_storage_account\" \"blob\" {\\n  name                     = \"stinfragraphprod\"\\n  account_tier             = \"Standard\"\\n  account_replication_type = \"LRS\"\\n}`,\n    entra:`resource \"azuread_application\" \"auth\" {\\n  display_name = \"infragraph-prod\"\\n}`,\n    keyvault:`resource \"azurerm_key_vault\" \"vault\" {\\n  name      = \"kv-infragraph-prod\"\\n  sku_name  = \"standard\"\\n}`,\n  };\n  awsFrag = {\n    frontdoor:`resource \"aws_cloudfront_distribution\" \"edge\" {\\n  enabled         = true\\n  default_root_object = \"index.html\"\\n}`,\n    appservice:`resource \"aws_ecs_cluster\" \"web\" {\\n  name = \"infragraph-prod\"\\n}`,\n    postgres:`resource \"aws_db_instance\" \"db\" {\\n  identifier     = \"pg-infragraph-prod\"\\n  engine         = \"postgres\"\\n  engine_version = \"16\"\\n  instance_class = \"db.m6g.large\"\\n}`,\n    redis:`resource \"aws_elasticache_cluster\" \"cache\" {\\n  cluster_id = \"redis-infragraph-prod\"\\n  engine     = \"redis\"\\n  node_type  = \"cache.t4g.small\"\\n}`,\n    blob:`resource \"aws_s3_bucket\" \"blob\" {\\n  bucket = \"infragraph-prod-assets\"\\n}`,\n    entra:`resource \"aws_cognito_user_pool\" \"auth\" {\\n  name = \"infragraph-prod\"\\n}`,\n    keyvault:`resource \"aws_secretsmanager_secret\" \"vault\" {\\n  name = \"infragraph-prod\"\\n}`,\n  };\n\n  buildCode(cloud, region, activeIds){\n    const isAz = cloud==='azure';\n    const head = `# InfraGraph \\u2014 generated from Internal Representation (IR)\\n# Target: ${isAz?'Azure':'AWS'} \\u00b7 ${region} \\u00b7 ${activeIds.filter(id=>this.nodes.find(n=>n.id===id).type!=='edge').length} resources\\n`;\n    const prov = isAz\n      ? `terraform {\\n  required_providers {\\n    azurerm = {\\n      source  = \"hashicorp/azurerm\"\\n      version = \"~> 3.110\"\\n    }\\n  }\\n}\\n\\nprovider \"azurerm\" {\\n  features {}\\n}\\n\\nresource \"azurerm_resource_group\" \"main\" {\\n  name     = \"rg-infragraph-prod\"\\n  location = \"${region.toLowerCase().replace(/[^a-z0-9]/g,'')}\"\\n}`\n      : `terraform {\\n  required_providers {\\n    aws = {\\n      source  = \"hashicorp/aws\"\\n      version = \"~> 5.50\"\\n    }\\n  }\\n}\\n\\nprovider \"aws\" {\\n  region = \"eu-west-2\"\\n}`;\n    const frags = activeIds.map(id => isAz ? this.azFrag[id] : this.awsFrag[id]).filter(Boolean);\n    return head + '\\n' + prov + '\\n\\n' + frags.join('\\n\\n');\n  }\n\n  tokenize(line){\n    if(line.trim().startsWith('#')) return [{ text: line||' ', style:{ color:'#8B8372', fontStyle:'italic', whiteSpace:'pre' } }];\n    const parts = line.split('\"'); const segs=[];\n    for(let i=0;i<parts.length;i++){\n      if(i%2===0){ if(parts[i]!=='') segs.push({ text:parts[i], style:{ color:'#CFC8B8', whiteSpace:'pre' } }); }\n      else { segs.push({ text:'\"'+parts[i]+'\"', style:{ color:'#7FD6A8', whiteSpace:'pre' } }); }\n    }\n    if(segs.length===0) segs.push({ text:' ', style:{ color:'#CFC8B8', whiteSpace:'pre' } });\n    return segs;\n  }\n\n  renderVals(){\n    const s = this.state;\n    const screen = s.screen;\n    const isLanding = screen==='landing';\n    const isStart = screen==='start';\n    const isWorkspace = screen==='workspace';\n    const isReview = screen==='review';\n    const isGenerating = screen==='generating';\n    const isOutput = screen==='output';\n    const isSplit = isWorkspace || isReview;\n    const appShell = isWorkspace || isReview || isGenerating || isOutput;\n    const showAppHeader = !['landing','pricing','about','docs','faq','contact','privacy','cookies','terms','confidentiality'].includes(screen);\n    const cloud = s.cloud;\n    const cloudLabel = cloud==='azure' ? 'Azure' : 'AWS';\n    const residencyLabel = s.residency==='uksouth' ? 'UK South' : s.residency==='ukwest' ? 'UK West' : 'eu-west-2 · London';\n    const inferenceLabel = s.inference==='managed' ? 'Managed · UK Bedrock' : 'BYOK · your key';\n\n    const stepIndex = isReview ? 1 : (isGenerating||isOutput) ? 2 : 0;\n    const stepDefs = [['1','Compose'],['2','Review'],['3','Generate']];\n    const steps = stepDefs.map(([num,label],i) => {\n      const done = i < stepIndex, current = i === stepIndex;\n      const numStyle = `width:20p
